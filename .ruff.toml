line-length = 120
target-version = "py311"

[lint]
select = ["E", "W", "F", "I"]  # Errors, Warnings, Unused imports, Isort
ignore = ["E501", "E701"]  # Line too long (formatter), multiple-statements (compact guard clauses)

[lint.per-file-ignores]
"tests/*" = ["E402"]  # Test files may need sys.path manipulation before imports

[lint.isort]
known-first-party = ["backend"]

[format]
quote-style = "double"
indent-style = "space"
