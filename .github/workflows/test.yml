name: Tests & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy types-PyYAML types-requests
      
      - name: Lint with ruff
        run: |
          ruff check backend/ tests/ --select=E,W,F --exit-zero
          ruff format backend/ tests/ --check
      
      - name: Type check with mypy
        run: |
          mypy backend/ --ignore-missing-imports --no-error-summary
      
      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=backend --cov-report=xml --cov-report=term-missing --cov-fail-under=60
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
