name: Build & Push Docker Image (ARM64)

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image for ARM64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/anansi:latest
            ghcr.io/${{ github.repository_owner }}/anansi:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

      - name: Image build summary
        run: |
          echo "✅ Docker Image Built Successfully"
          echo "Platform: linux/arm64 (Apple Silicon/macOS)"
          echo "Port: 9000"
          echo "Tags: latest, ${{ github.sha }}"
          echo "Registry: ghcr.io/${{ github.repository_owner }}/anansi"
          echo ""
          echo "Pull command:"
          echo "docker pull ghcr.io/${{ github.repository_owner }}/anansi:latest"
