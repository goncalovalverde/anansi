name: Build & Push Docker Image

on:
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          REGISTRY="ghcr.io/${{ github.repository_owner }}/anansi"
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tags=${REGISTRY}:stable,${REGISTRY}:${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "summary_tags=stable, ${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${REGISTRY}:latest" >> "$GITHUB_OUTPUT"
            echo "summary_tags=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

      - name: Image build summary
        run: |
          echo "✅ Docker Image Built Successfully"
          echo "Platforms: linux/amd64 (Windows/Intel), linux/arm64 (Apple Silicon)"
          echo "Port: 9000"
          echo "Tags: ${{ steps.tags.outputs.summary_tags }}"
          echo "Registry: ghcr.io/${{ github.repository_owner }}/anansi"
          echo ""
          echo "Pull command:"
          echo "docker pull ghcr.io/${{ github.repository_owner }}/anansi:${{ github.event_name == 'release' && 'stable' || 'latest' }}"
