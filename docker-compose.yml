version: '3.8'

services:
  anansi:
    build: .
    image: anansi:latest
    container_name: anansi-dashboard
    ports:
      - "9000:9000"
    volumes:
      - anansi-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/api')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  anansi-data:
    driver: local
